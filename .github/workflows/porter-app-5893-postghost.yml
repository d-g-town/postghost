"on":
    push:
        branches:
            - main
name: Deploy to postghost
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: postghost
                PORTER_CLUSTER: "5893"
                PORTER_DEPLOYMENT_TARGET_ID: ede815fb-dc33-447d-bfa5-dd86769201ad
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "19436"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_19436_18306 }}
