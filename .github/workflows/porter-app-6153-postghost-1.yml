"on":
    push:
        branches:
            - main
name: Deploy to postghost-1
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: postghost-1
                PORTER_CLUSTER: "6153"
                PORTER_DEPLOYMENT_TARGET_ID: 6c676662-f82e-4589-be92-c6440412844b
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "20151"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_20151_27421 }}
                DOCKER_BUILDKIT: '1'
