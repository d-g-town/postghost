services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postghost
      POSTGRES_PASSWORD: postghost
      POSTGRES_DB: postghost
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postghost -d postghost"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: postghost
      DB_USER: postghost
      DB_PASS: postghost
      DB_SSLMODE: disable
      PORT: "8080"
    ports:
      # Host port is overridable; 8080 is often already taken locally.
      - "${HOST_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
